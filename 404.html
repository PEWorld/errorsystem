<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERROR 404 — Error System</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  @font-face{font-family:'Archivo';src:url('/assets/fonts/archivo-var.woff2') format('woff2');font-weight:100 900;font-stretch:62% 125%;font-display:swap}
  @font-face{font-family:'Plex';src:url('/assets/fonts/plex-400.woff2') format('woff2');font-weight:400;font-display:swap}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
    background:#060708;color:#ece9e2;font-family:'Archivo',sans-serif;text-align:center;padding:24px;overflow:hidden}
  .code{font-weight:840;font-variation-settings:'wdth' 118;text-transform:uppercase;line-height:.85;
    font-size:clamp(72px,22vw,240px);letter-spacing:-.03em}
  .code b{color:#ff4a00;-webkit-text-stroke:0}
  .tag{font-family:'Plex',monospace;font-size:12px;letter-spacing:.22em;color:#8a8f93;text-transform:uppercase}
  a{display:inline-flex;align-items:center;gap:9px;background:#ff4a00;color:#0a0402;text-decoration:none;
    font-weight:600;font-size:14px;padding:14px 28px;border-radius:99px;transition:transform .25s}
  a:hover{transform:scale(1.05)}
  a i{width:7px;height:7px;border-radius:50%;background:#0a0402}
</style>
</head>
<body>
  <p class="tag">// SIGNAL LOST</p>
  <h1 class="code">ERR<b>O</b>R<br>404</h1>
  <p class="tag">This world doesn't exist — yet.</p>
  <a href="/"><i></i>Back to base</a>
</body>
